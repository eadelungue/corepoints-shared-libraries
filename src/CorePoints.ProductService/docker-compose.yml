version: '3.8'

services:
  product-service:
    build:
      context: ../../
      dockerfile: src/CorePoints.ProductService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__ProductDb=Host=postgres;Port=5432;Database=product_service;Username=product_user;Password=product_pass
      - ConnectionStrings__FeatureTogglesDb=Host=postgres;Port=5432;Database=product_service;Username=product_user;Password=product_pass
      - Caching__RedisConnectionString=redis:6379
      - Services__Ledger__BaseUrl=http://host.docker.internal:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: product_service
      POSTGRES_USER: product_user
      POSTGRES_PASSWORD: product_pass
    ports:
      - "5432:5432"
    volumes:
      - ./Migrations/001_create_product_schema.sql:/docker-entrypoint-initdb.d/001_create_product_schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_user -d product_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
